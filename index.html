<style>

<script>
"use strict";

const DB="RobustChineseNewsDB";
const STORE="articles";
const FULL_LIMIT=40;
const PAGE=30;
const SETTINGS="nexusNewsSettings";

let db,articles=[],filter="all";
let busy=false,enriching=false;
let shown=PAGE,autoTimer=null,renderTimer=null;
const $=id=>document.getElementById(id);

/* Google 新聞來源：繁體財經最優先 */

const SOURCES=[
 {name:"Google 繁體財經",type:"tw",priority:0,
 url:"https://news.google.com/rss/search?q=%E8%B2%A1%E7%B6%93+OR+%E8%82%A1%E5%B8%82+OR+%E5%8F%B0%E8%82%A1+OR+%E7%BE%8E%E8%82%A1&hl=zh-TW&gl=TW&ceid=TW:zh-Hant"},

 {name:"Google 繁體新聞",type:"tw",priority:1,
 url:"https://news.google.com/rss?hl=zh-TW&gl=TW&ceid=TW:zh-Hant"},

 {name:"Google 國際",type:"tw",priority:2,
 url:"https://news.google.com/rss/headlines/section/topic/WORLD?hl=zh-TW&gl=TW&ceid=TW:zh-Hant"},

 {name:"Google 科技",type:"tw",priority:3,
 url:"https://news.google.com/rss/headlines/section/topic/TECHNOLOGY?hl=zh-TW&gl=TW&ceid=TW:zh-Hant"},

 {name:"Google 健康",type:"tw",priority:4,
 url:"https://news.google.com/rss/headlines/section/topic/HEALTH?hl=zh-TW&gl=TW&ceid=TW:zh-Hant"},

 {name:"Google 娛樂",type:"tw",priority:5,
 url:"https://news.google.com/rss/headlines/section/topic/ENTERTAINMENT?hl=zh-TW&gl=TW&ceid=TW:zh-Hant"},

 {name:"Google 體育",type:"tw",priority:6,
 url:"https://news.google.com/rss/headlines/section/topic/SPORTS?hl=zh-TW&gl=TW&ceid=TW:zh-Hant"},

 {name:"Google 簡體新聞",type:"cn",priority:10,
 url:"https://news.google.com/rss?hl=zh-CN&gl=CN&ceid=CN:zh-Hans"},

 {name:"自由時報",type:"tw",priority:20,
 url:"https://news.ltn.com.tw/rss/all.xml"},

 {name:"中央社",type:"tw",priority:21,
 url:"https://feeds.feedburner.com/rsscna/main"},

 {name:"公視新聞",type:"tw",priority:22,
 url:"https://about.pts.org.tw/rss/XML/newsfeed.xml"},

 {name:"中時新聞網",type:"tw",priority:23,
 url:"https://www.chinatimes.com/rss/realtimenews.xml"}
];

/* 多工 */

async function mapLimit(items,n,fn){
 const out=new Array(items.length);
 let i=0;
 await Promise.all(Array.from({length:n},async()=>{
  while(i<items.length){
   const k=i++;
   out[k]=await fn(items[k]);
  }
 }));
 return out;
}

function log(s){
 $("log").style.display="block";
 $("log").textContent=s;
}

/* 分類 */

const TABS=[
 ["all","全部"],
 ["unread","未讀"],
 ["tw","繁體"],
 ["cn","簡體"],
 ["fav","收藏"]
];

TABS.forEach(([k,t],i)=>{
 const b=document.createElement("button");
 b.className="tab"+(i?"":" active");
 b.textContent=t;
 b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  filter=k;
  shown=PAGE;
  render();
 };
 $("tabs").appendChild(b);
});

/* 設定 */

function loadSettings(){
 let s={};
 try{s=JSON.parse(localStorage.getItem(SETTINGS)||"{}")}catch(e){}

 $("limit").value=s.limit||"200";
 $("sort").value=s.sort||"new";
 $("size").value=s.size||"25";
 $("auto").value=s.auto||"0";
 applySettings();
}

function applySettings(){
 try{
  localStorage.setItem(SETTINGS,JSON.stringify({
   limit:$("limit").value,
   sort:$("sort").value,
   size:$("size").value,
   auto:$("auto").value
  }));
 }catch(e){}

 document.documentElement.style.setProperty("--fs",$("size").value+"px");

 clearInterval(autoTimer);
 const m=Number($("auto").value);

 if(m){
  autoTimer=setInterval(()=>{
   if(!busy&&navigator.onLine&&!document.hidden)syncNews();
  },m*60000);
 }
}

/* 資料庫 */

function dbInit(){
 return new Promise((res,rej)=>{
  const r=indexedDB.open(DB,1);

  r.onupgradeneeded=e=>{
   const d=e.target.result;
   if(!d.objectStoreNames.contains(STORE)){
    d.createObjectStore(STORE,{keyPath:"link"});
   }
  };

  r.onsuccess=e=>{db=e.target.result;res()};
  r.onerror=()=>rej(r.error);
 });
}

function getAll(){
 return new Promise((res,rej)=>{
  const r=db.transaction(STORE,"readonly").objectStore(STORE).getAll();
  r.onsuccess=()=>res(r.result||[]);
  r.onerror=()=>rej(r.error);
 });
}

function putMany(list){
 return new Promise((res,rej)=>{
  const tx=db.transaction(STORE,"readwrite");
  const s=tx.objectStore(STORE);
  list.forEach(a=>{if(a.link)s.put(a)});
  tx.oncomplete=res;
  tx.onerror=tx.onabort=()=>rej(tx.error);
 });
}

function removeMany(links){
 return new Promise((res,rej)=>{
  const tx=db.transaction(STORE,"readwrite");
  const s=tx.objectStore(STORE);
  links.forEach(l=>s.delete(l));
  tx.oncomplete=res;
  tx.onerror=tx.onabort=()=>rej(tx.error);
 });
}

/* 文字及圖片 */

function validURL(url){
 if(!url)return "";
 try{
  const u=new URL(String(url).trim());
  return ["https:","http:"].includes(u.protocol)?u.href:"";
 }catch(e){return ""}
}

function stripURL(t){
 return String(t||"")
  .replace(/https?:\/\/[^\s)）\]]+/gi,"")
  .replace(/\(\s*\)|（\s*）|\[\s*\]/g,"")
  .replace(/[ \t]{2,}/g," ")
  .replace(/\n{3,}/g,"\n\n").trim();
}

function clean(html){
 if(!html)return "";
 try{
  const d=new DOMParser().parseFromString(html,"text/html");
  d.querySelectorAll("script,style,iframe,object,form,svg,button,noscript")
   .forEach(x=>x.remove());
  return stripURL((d.body.textContent||"").replace(/\s+/g," ")).slice(0,25000);
 }catch(e){
  return String(html).replace(/<[^>]*>/g," ").trim().slice(0,25000);
 }
}

function extractImages(html){
 if(!html)return [];
 const found=[];

 try{
  const d=new DOMParser().parseFromString(html,"text/html");

  d.querySelectorAll("img").forEach(img=>{
   ["src","data-src","data-original","data-lazy-src","data-original-src","data-url"].forEach(k=>{
    const u=validURL(img.getAttribute(k));
    if(u&&!found.includes(u))found.push(u);
   });

   const ss=img.getAttribute("srcset");
   if(ss){
    const u=validURL(ss.split(",")[0].trim().split(/\s+/)[0]);
    if(u&&!found.includes(u))found.push(u);
   }
  });

  d.querySelectorAll('meta[property="og:image"],meta[name="twitter:image"]')
   .forEach(m=>{
    const u=validURL(m.content);
    if(u&&!found.includes(u))found.push(u);
   });
 }catch(e){}

 return found;
}

function getLocal(node,name){
 for(const c of Array.from(node.children||[])){
  if(c.localName===name||c.nodeName.endsWith(":"+name)){
   return c.textContent.trim();
  }
 }
 return "";
}

function allLocal(node,name){
 return Array.from(node.getElementsByTagName("*"))
  .filter(x=>x.localName===name||x.nodeName.endsWith(":"+name));
}

/* 建立新聞 */

function makeArticle(title,link,date,description,source,image,images=[]){
 if(!title||!link)return null;

 link=validURL(link);
 if(!link)return null;

 let time=date?new Date(date).getTime():Date.now();
 if(!Number.isFinite(time))time=Date.now();

 const imgs=[image,...images].map(validURL).filter(Boolean);

 return {
  title:String(title).trim(),link,pubDate:time,
  desc:clean(description)||"目前沒有提供新聞摘要。",
  image:imgs[0]||"",
  images:[...new Set(imgs)].slice(0,8),
  source:source.name,category:source.type,
  priority:source.priority,
  favorite:false,read:false,full:false,
  failed:0,fullStatus:"等待擷取"
 };
}

/* RSS XML */

function parseXML(xml,source){
 const doc=new DOMParser().parseFromString(xml,"application/xml");
 if(doc.querySelector("parsererror"))throw Error("XML格式錯誤");

 const nodes=[
  ...doc.getElementsByTagName("item"),
  ...doc.getElementsByTagName("entry")
 ];

 return nodes.map(n=>{
  const title=getLocal(n,"title");
  let link=getLocal(n,"link");

  if(!link){
   const l=allLocal(n,"link").find(x=>
    !x.getAttribute("rel")||x.getAttribute("rel")==="alternate"
   );
   link=l?.getAttribute("href")||"";
  }

  const date=getLocal(n,"pubDate")||
   getLocal(n,"published")||getLocal(n,"updated");

  const desc=getLocal(n,"description")||
   getLocal(n,"summary")||getLocal(n,"encoded")||
   getLocal(n,"content");

  const images=[];

  ["enclosure","content","thumbnail","image"].forEach(t=>{
   allLocal(n,t).forEach(el=>{
    const u=validURL(
     el.getAttribute("url")||el.getAttribute("href")||el.textContent
    );
    if(u&&!images.includes(u))images.push(u);
   });
  });

  extractImages(desc).forEach(u=>{
   if(!images.includes(u))images.push(u);
  });

  return makeArticle(title,link,date,desc,source,images[0]||"",images);
 }).filter(Boolean);
}

/* 網路 */

async function request(url,headers={},timeout=25000){
 const c=new AbortController();
 const t=setTimeout(()=>c.abort(),timeout);

 try{
  const r=await fetch(url,{signal:c.signal,cache:"no-store",headers});
  if(!r.ok)throw Error("HTTP "+r.status);
  return await r.text();
 }catch(e){
  throw Error(e.name==="AbortError"?"逾時":e.message);
 }finally{
  clearTimeout(t);
 }
}

/* RSS 備援 */

async function viaJSON(source){
 const data=JSON.parse(await request(
  "https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(source.url)
 ));

 if(data.status!=="ok"||!Array.isArray(data.items)){
  throw Error(data.message||"RSS2JSON錯誤");
 }

 return data.items.map(x=>{
  const html=x.content||x.description||"";
  const imgs=[
   x.thumbnail,x.enclosure?.link,x.enclosure?.url,x.image,
   ...extractImages(html)
  ].map(validURL).filter(Boolean);

  return makeArticle(x.title,x.link,x.pubDate,html,source,imgs[0]||"",imgs);
 }).filter(Boolean);
}

async function viaProxy(source){
 const xml=await request("https://api.allorigins.win/raw?url="+encodeURIComponent(source.url));
 if(!xml.includes("<")||xml.length<100)throw Error("沒有有效XML");
 return parseXML(xml,source);
}

async function viaProxy2(source){
 const xml=await request("https://corsproxy.io/?"+encodeURIComponent(source.url));
 if(!xml.includes("<")||xml.length<100)throw Error("沒有有效XML");
 return parseXML(xml,source);
}

function proxyFn(label,mk,json){
 const f=async source=>{
  let xml=await request(mk(encodeURIComponent(source.url)));
  if(json)xml=JSON.parse(xml).contents||"";
  if(!xml.includes("<")||xml.length<100)throw Error("沒有有效XML");
  return parseXML(xml,source);
 };
 f.label=label;
 return f;
}

viaJSON.label="rss2json";
viaProxy.label="allorigins";
viaProxy2.label="corsproxy";

const EXTRA=[
 proxyFn("allorigins-get",u=>"https://api.allorigins.win/get?url="+u,true),
 proxyFn("codetabs",u=>"https://api.codetabs.com/v1/proxy?quest="+u),
 proxyFn("thingproxy",u=>"https://thingproxy.freeboard.io/fetch/"+decodeURIComponent(u))
];

async function fetchSource(source){
 const errors=[];
 for(const fn of [viaJSON,viaProxy,viaProxy2,...EXTRA]){
  try{
   const list=await fn(source);
   if(list.length)return {ok:true,list};
   errors.push(fn.label+":沒有新聞");
  }catch(e){
   errors.push(fn.label+":"+e.message);
  }
 }
 return {ok:false,error:"\n   "+errors.join("\n   ")};
}

/* Jina 全文 */

function extractMarkdownImages(text){
 const images=[];
 const re=/!\[[^\]]*\]\((https?:\/\/[^)\s]+)(?:\s+"[^"]*")?\)/gi;
 let m;
 while((m=re.exec(text))!==null){
  const u=validURL(m[1]);
  if(u&&!images.includes(u))images.push(u);
 }
 return images;
}

function cleanReaderText(text){
 return stripURL(
  String(text||"")
  .replace(/^(Title|URL Source|Published Time|Markdown Content):.*$/gim,"")
  .replace(/!\[([^\]]*)\]\([^)]+\)/g,"")
  .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,"$1")
  .replace(/^#{1,6}\s*/gm,"")
  .replace(/^\s*[-*_]{3,}\s*$/gm,"")
  .replace(/\n{3,}/g,"\n\n")
 ).slice(0,25000);
}

async function readFullArticle(a){
 const text=await request(
  "https://r.jina.ai/"+a.link,
  {
   "Accept":"text/plain",
   "X-Respond-With":"markdown",
   "X-Retain-Images":"all",
   "X-Timeout":"25"
  },35000
 );

 if(!text||text.length<150)throw Error("擷取內容太短");

 const content=cleanReaderText(text);
 if(content.length<150)throw Error("沒有取得有效內文");

 const images=extractMarkdownImages(text).filter(u=>
  !/logo|icon|avatar|sprite|pixel/i.test(u)
 );

 return {desc:content,image:images[0]||a.image,images};
}

/* 全文 */

function scheduleRender(){
 if(renderTimer)return;
 renderTimer=setTimeout(()=>{
  renderTimer=null;
  render();
 },700);
}

async function enrichArticles(list,force=false){
 if(enriching||!navigator.onLine)return;

 enriching=true;

 const targets=list.filter(a=>
  !a.full&&a.link&&(force||!a.failed||a.failed<2)
 ).sort((a,b)=>
  (a.priority??99)-(b.priority??99)||b.pubDate-a.pubDate
 ).slice(0,FULL_LIMIT);

 let ok=0,fail=0,done=0,idx=0;

 log("正在擷取 Google 優先新聞全文及照片...\n準備處理 "+targets.length+" 則");

 async function worker(){
  while(idx<targets.length){
   const a=targets[idx++];

   try{
    const r=await readFullArticle(a);
    a.desc=r.desc;
    a.full=true;
    a.failed=0;
    a.fullStatus="✓ 已取得完整內文";

    if(r.image)a.image=r.image;

    a.images=[...new Set([
     ...(a.images||[]),...r.images
    ])].slice(0,8);

    ok++;
   }catch(e){
    a.failed=(a.failed||0)+1;
    a.fullStatus="未取得全文，保留RSS摘要："+e.message;
    fail++;
   }

   done++;
   try{await putMany([a])}catch(e){}
   scheduleRender();

   log("全文擷取進度："+done+"/"+targets.length+
       "\n成功："+ok+"　失敗："+fail);
  }
 }

 await Promise.all([worker(),worker(),worker()]);

 enriching=false;

 log("全文擷取完成！\n成功："+ok+" 則　失敗："+fail+
     " 則\n未取得全文的新聞仍保留原有摘要。");

 render();
}

/* 合併新聞及優先排序 */

function mergeArticles(incoming){
 const map=new Map(articles.map(a=>{
  if(a.priority===undefined){
   a.priority=(a.source||"").startsWith("Google")?10:20;
  }
  return [a.link,a];
 }));

 incoming.forEach(a=>{
  const old=map.get(a.link);

  if(old){
   const better=(a.priority??99)<(old.priority??99);

   map.set(a.link,{
    ...old,
    title:better?a.title:old.title,
    source:better?a.source:old.source,
    category:better?a.category:old.category,
    priority:Math.min(old.priority??99,a.priority??99),
    image:old.image||a.image,
    images:[...new Set([...(old.images||[]),...(a.images||[])])].slice(0,8),
    desc:old.full?old.desc:(better?a.desc:old.desc)
   });
  }else{
   map.set(a.link,a);
  }
 });

 return Array.from(map.values()).sort((a,b)=>
  (a.priority??99)-(b.priority??99)||b.pubDate-a.pubDate
 );
}

/* 更新 */

async function syncNews(){
 if(busy)return;
 if(!navigator.onLine){alert("請先連接網路");return}

 busy=true;
 $("sync").disabled=true;
 $("sync").textContent="⏳ 正在抓取...";

 try{
  log("Google 繁體財經優先抓取中...\n正在連接 "+SOURCES.length+" 個來源");

  const results=await mapLimit(SOURCES,4,s=>
   fetchSource(s).then(r=>({s,r}))
  );

  const incoming=[],report=[];

  results.forEach(({s,r})=>{
   if(r.ok){
    incoming.push(...r.list);
    report.push("✓ "+s.name+"："+r.list.length+"則");
   }else{
    report.push("✗ "+s.name+"："+r.error);
   }
  });

  if(!incoming.length){
   log("所有來源均無法取得。\n\n"+report.join("\n")+
       "\n\n原有資料沒有刪除。");
   return;
  }

  const all=mergeArticles(incoming);
  const limit=$("limit").value;
  const keep=[],drop=[];

  all.forEach(a=>{
   if(a.favorite||limit==="all"||keep.length<Number(limit)){
    keep.push(a);
   }else{
    drop.push(a);
   }
  });

  articles=keep;
  await putMany(articles);

  if(drop.length)await removeMany(drop.map(a=>a.link));

  render();

  log("RSS更新完成！\n\n"+report.join("\n")+
      "\n\n本次取得："+incoming.length+
      "則\n保存："+articles.length+
      "則\n開始擷取全文及照片...");

  await enrichArticles(articles);

 }catch(e){
  log("更新錯誤："+e.message+"\n原有新聞仍保留。");
 }finally{
  busy=false;
  $("sync").disabled=false;
  $("sync").textContent="⟳ 開始更新新聞";
 }
}

/* 測試來源 */

async function testSources(){
 if(busy)return;
 if(!navigator.onLine){alert("請先連接網路");return}

 busy=true;
 $("test").disabled=true;
 $("test").textContent="測試中...";

 try{
  log("正在測試 Google 及其他來源...");
  const res=await mapLimit(SOURCES,4,s=>
   fetchSource(s).then(r=>
    r.ok?"✓ "+s.name+"："+r.list.length+"則":
    "✗ "+s.name+"："+r.error
   )
  );
  log("新聞來源測試結果：\n\n"+res.join("\n"));
 }finally{
  busy=false;
  $("test").disabled=false;
  $("test").textContent="🔧 測試來源";
 }
}

/* 統計 */

function updateStats(){
 $("total").textContent=articles.length;
 $("favCount").textContent=articles.filter(a=>a.favorite).length;

 const d=new Date();
 const start=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();

 $("today").textContent=articles.filter(a=>a.pubDate>=start).length;
}

function dateText(t){
 const d=new Date(t);
 return isNaN(d.getTime())?"日期不明":d.toLocaleString("zh-TW");
}

function el(tag,cls,txt){
 const x=document.createElement(tag);
 if(cls)x.className=cls;
 if(txt!==undefined)x.textContent=txt;
 return x;
}

/* 照片 */

function showPhoto(url){
 const s=validURL(url);
 if(!s)return;
 $("largePhoto").src=s;
 $("photoModal").style.display="flex";
}

function closePhoto(){
 $("photoModal").style.display="none";
 $("largePhoto").src="";
}

$("closePhoto").onclick=closePhoto;
$("photoModal").onclick=e=>{
 if(e.target===$("photoModal"))closePhoto();
};

async function persist(a){
 try{await putMany([a])}catch(e){}
}

/* 新聞卡片 */

function buildCard(a){
 const isGoogle=(a.source||"").startsWith("Google");
 const isFinance=(a.source||"").includes("財經");

 const card=el("article",
  "card open"+(a.read?" read":"")+(isGoogle?" google":""));

 const meta=el("div","meta");
 const left=el("span","tag",a.source);
 const right=el("span","",dateText(a.pubDate));

 if(isGoogle)left.classList.add("google-label");
 if(isFinance)left.classList.add("finance-label");

 meta.append(left,right);

 const h3=el("h3","",a.title);
 const body=el("div","body");

 card.append(meta,h3,body);

 h3.onclick=()=>{
  card.classList.toggle("open");
  if(card.classList.contains("open")){
   card.scrollIntoView({block:"nearest",behavior:"smooth"});
  }
 };

 const imgs=[];
 [a.image,...(a.images||[])].forEach(u=>{
  if(validURL(u)&&!imgs.includes(u))imgs.push(u);
 });

 if(imgs.length){
  const img=el("img","news-image");
  let i=0;
  img.alt=a.title;
  img.loading="lazy";
  img.decoding="async";
  img.referrerPolicy="no-referrer";

  img.onerror=()=>{
   i++;
   if(i<imgs.length)img.src=imgs[i];
   else img.remove();
  };

  img.onclick=()=>showPhoto(img.src);
  img.src=imgs[0];
  body.appendChild(img);
 }

 body.appendChild(el("div","desc",stripURL(a.desc)||"目前沒有可顯示的內文。"));
 body.appendChild(el("div","article-status",a.fullStatus||"等待全文擷取"));

 const actions=el("div","actions");

 const toggle=el("button","",a.read?"標為未讀":"標為已讀");
 toggle.onclick=()=>{
  a.read=!a.read;
  card.classList.toggle("read",a.read);
  toggle.textContent=a.read?"標為未讀":"標為已讀";
  persist(a);
  updateStats();
  if(filter==="unread")render();
 };

 const star=el("button","star",a.favorite?"★ 已收藏":"☆ 收藏");
 star.onclick=()=>{
  a.favorite=!a.favorite;
  star.textContent=a.favorite?"★ 已收藏":"☆ 收藏";
  persist(a);
  updateStats();
  if(filter==="fav")render();
 };

 actions.append(toggle,star);

 if(navigator.share){
  const sh=el("button","","分享");
  sh.onclick=()=>navigator.share({title:a.title,url:a.link}).catch(()=>{});
  actions.appendChild(sh);
 }

 body.appendChild(actions);
 return card;
}

/* 顯示新聞：Google財經第一，繁體第二 */

function render(){
 updateStats();

 const box=$("news");
 const kw=$("search").value.trim().toLowerCase();

 const list=articles.filter(a=>{
  if(filter==="tw"&&a.category!=="tw")return false;
  if(filter==="cn"&&a.category!=="cn")return false;
  if(filter==="fav"&&!a.favorite)return false;
  if(filter==="unread"&&a.read)return false;

  return !kw||(a.title+" "+a.desc+" "+a.source).toLowerCase().includes(kw);
 }).sort((a,b)=>{
  const pa=a.priority??99;
  const pb=b.priority??99;

  if(pa!==pb)return pa-pb;

  return $("sort").value==="old"
   ?a.pubDate-b.pubDate
   :b.pubDate-a.pubDate;
 });

 box.replaceChildren();

 if(!list.length){
  box.appendChild(el("div","empty","目前沒有符合條件的新聞"));
  $("more").style.display="none";
  return;
 }

 /* 全部顯示模式 */
 const showAll=$("limit").value==="all";
 const count=showAll?list.length:shown;

 const frag=document.createDocumentFragment();

 list.slice(0,count).forEach(a=>{
  frag.appendChild(buildCard(a));
 });

 box.appendChild(frag);

 $("more").style.display=
  !showAll&&list.length>shown?"block":"none";

 if(!showAll){
  $("moreBtn").textContent="載入更多（還有 "+(list.length-shown)+" 則）";
 }
}

/* 回頂浮標 */

const topFloat=$("topFloat");

window.addEventListener("scroll",()=>{
 topFloat.classList.toggle("hidden",window.scrollY<180);
},{passive:true});

topFloat.onclick=()=>{
 window.scrollTo({top:0,behavior:"smooth"});
};

/* 按鈕事件 */

$("sync").onclick=syncNews;
$("test").onclick=testSources;

$("retry").onclick=()=>{
 if(busy||enriching)return;
 articles.forEach(a=>{if(!a.full)a.failed=0});
 enrichArticles(articles,true);
};

$("moreBtn").onclick=()=>{
 shown+=PAGE;
 render();
};

let st;
$("search").oninput=()=>{
 clearTimeout(st);
 st=setTimeout(()=>{
  shown=PAGE;
  render();
 },250);
};

$("sort").onchange=()=>{
 applySettings();
 render();
};

$("size").onchange=()=>{
 applySettings();
 render();
};

$("auto").onchange=applySettings;

$("limit").onchange=()=>{
 applySettings();
 shown=PAGE;
 render();

 if($("limit").value==="all"){
  log("已切換全部新聞顯示模式。\n目前保存的新聞將一次全部顯示。");
 }else{
  log("已變更保存數量。下次更新時依新設定整理新聞。");
 }
};

/* 網路 */

function setNet(){
 const on=navigator.onLine;
 $("status").textContent=on?"● 網路已連線":"○ 離線閱讀模式";
 $("status").className="status"+(on?"":" offline");
}

window.addEventListener("online",setNet);
window.addEventListener("offline",setNet);

/* 啟動 */

async function start(){
 loadSettings();

 try{
  await dbInit();
  articles=await getAll();

  articles.forEach(a=>{
   if(a.priority===undefined){
    a.priority=(a.source||"").startsWith("Google")?10:20;
   }
   if(!Array.isArray(a.images)){
    a.images=a.image?[a.image]:[];
   }
  });

  setNet();
  render();

  if(!articles.length&&navigator.onLine){
   await syncNews();
  }else{
   log("本機新聞載入完成，共 "+articles.length+
       " 則。\nGoogle 繁體財經優先顯示。\n"+
       "可選擇「保存全部新聞」一次顯示所有保存內容。");
  }

 }catch(e){
  log("資料庫啟動失敗："+e.message);
 }
}

start();

</script>
