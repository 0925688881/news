<style>
*{box-sizing:border-box}
:root{--bg:#080f20;--panel:#12213a;--line:#29415f;--deep:#091529;--text:#edf4ff;--mute:#91a4c0;--cyan:#40dfdd;--blue:#147ee9;--fs:25px}
html{scroll-behavior:smooth}
body{margin:0 auto;padding:12px;padding-top:max(12px,env(safe-area-inset-top));background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;max-width:900px;font-size:var(--fs)}
.header,.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand-icon{width:65px;height:65px;flex-shrink:0}
.logo{font-size:32px;font-weight:900;color:var(--cyan);letter-spacing:1px}
.sub{font-size:13px;color:var(--mute);margin-top:4px}
.status{font-size:15px;color:#39d99b;margin-top:10px}
.offline{color:#ff7183}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--deep);padding:10px 4px;text-align:center;border-radius:10px}
.stat strong{display:block;color:var(--cyan);font-size:27px}
.stat span{font-size:13px;color:var(--mute)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
select,input{width:100%;min-width:0;padding:13px;background:var(--deep);border:1px solid var(--line);border-radius:10px;color:#fff;font-size:17px}
button{border:0;border-radius:10px;padding:13px;font-weight:bold;cursor:pointer;font-size:16px;color:#fff;background:#203b5b}
button:disabled{opacity:.5}
.primary{background:var(--blue);width:100%;margin-top:10px}
.row{display:flex;gap:8px;margin-top:8px}
.row button{flex:1}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:10px 0 0;padding-bottom:4px}
.tab{white-space:nowrap;background:#20324d;color:#a8bdd8;font-size:15px}
.tab.active{background:var(--blue);color:#fff}
#log{display:none;background:#102e48;border:1px solid #28618b;padding:12px;border-radius:10px;margin-bottom:12px;font-size:14px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}
.card{overflow:hidden}
.card.read{opacity:.78}
.card.google{border-left:5px solid var(--cyan)}
.meta{display:flex;justify-content:space-between;gap:8px;color:var(--mute);font-size:14px;flex-wrap:wrap}
.tag{color:var(--cyan);font-weight:bold}
.finance-label{color:#ffcf65}
.headline-row{display:flex;align-items:flex-start;gap:13px;margin-top:12px}

.thumb-placeholder{width:120px;height:92px;flex-shrink:0;border-radius:10px;background:linear-gradient(145deg,#102b49,#091529);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:#40dfdd;font-size:30px}
.headline-title{flex:1;min-width:0}
.card h3{font-size:1.17em;line-height:1.55;margin:0;color:#fff;overflow-wrap:anywhere;cursor:pointer}
.card h3::after{content:' ▾';color:var(--cyan);font-size:.75em}
.card.open h3::after{content:' ▴'}
.body{display:none;margin-top:10px}
.card.open .body{display:block}
.news-image{display:block;width:100%;max-height:440px;object-fit:contain;border-radius:12px;margin:12px 0;background:var(--deep);cursor:zoom-in}
.desc{color:#e0e9f5;font-size:1.05em;line-height:1.95;white-space:pre-wrap;overflow-wrap:anywhere}
.article-status{color:#70baff;font-size:14px;margin-top:12px}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.actions button{font-size:15px;padding:11px 13px;background:#203b5b}
.actions .star{background:#463817;color:#ffcf65}
.empty{text-align:center;padding:36px 12px;color:var(--mute);background:var(--panel);border-radius:12px}
.small{font-size:14px;color:var(--mute);line-height:1.8;margin-top:10px}
.footer{text-align:center;color:#627a9a;font-size:13px;padding:18px}
#topFloat{position:fixed;left:7px;top:52%;transform:translateY(-50%);z-index:9000;width:55px;height:67px;border-radius:30px;padding:5px 2px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1px;background:linear-gradient(145deg,#087ef5,#073e80);border:2px solid #40dfdd;box-shadow:0 0 12px #147ee9,0 0 28px #147ee966;color:#fff;transition:opacity .25s,transform .25s}

#photoModal img{max-width:100%;max-height:85vh;object-fit:contain;border-radius:8px}
#photoModal button{position:absolute;right:12px;top:max(16px,env(safe-area-inset-top))}
@media(max-width:480px){
body{padding:9px;padding-top:max(9px,env(safe-area-inset-top))}

.logo{font-size:27px}
.brand-icon{width:55px;height:55px}

<script>
"use strict";
const DB="RobustChineseNewsDB",STORE="articles",FULL_LIMIT=100,PAGE=30,SETTINGS="nexusNewsSettings";
let db,articles=[],filter="all",busy=false,enriching=false,shown=PAGE,autoTimer=null,renderTimer=null;
const $=id=>document.getElementById(id);

const G="https://news.google.com/rss";
const Q="?hl=zh-TW&gl=TW&ceid=TW:zh-Hant";
const SOURCES=[
 {name:"Google 繁體財經",type:"tw",url:G+"/search?q=%E8%B2%A1%E7%B6%93+OR+%E8%82%A1%E5%B8%82+OR+%E5%8F%B0%E8%82%A1+OR+%E7%BE%8E%E8%82%A1&hl=zh-TW&gl=TW&ceid=TW:zh-Hant"},
 {name:"Google 繁體新聞",type:"tw",url:G+Q},
 {name:"Google 國際",type:"tw",url:G+"/headlines/section/topic/WORLD"+Q},
 {name:"Google 科技",type:"tw",url:G+"/headlines/section/topic/TECHNOLOGY"+Q},
 {name:"Google 健康",type:"tw",url:G+"/headlines/section/topic/HEALTH"+Q},
 {name:"Google 娛樂",type:"tw",url:G+"/headlines/section/topic/ENTERTAINMENT"+Q},
 {name:"Google 體育",type:"tw",url:G+"/headlines/section/topic/SPORTS"+Q},
 {name:"Google 簡體新聞",type:"cn",url:G+"?hl=zh-CN&gl=CN&ceid=CN:zh-Hans"},
 {name:"自由時報",type:"tw",url:"https://news.ltn.com.tw/rss/all.xml"},
 {name:"中央社",type:"tw",url:"https://feeds.feedburner.com/rsscna/main"},
 {name:"公視新聞",type:"tw",url:"https://about.pts.org.tw/rss/XML/newsfeed.xml"},
 {name:"中時新聞網",type:"tw",url:"https://www.chinatimes.com/rss/realtimenews.xml"}
];

/* 日期：最新在上。修正無時區字串(視為UTC)與未來時間 */
function parseTime(d){
 let t=NaN;
 if(typeof d==="number")t=d;
 else if(d){
  let s=String(d).trim();
  if(/^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$/.test(s))s=s.replace(" ","T")+"Z";
  t=new Date(s).getTime();
 }
 const now=Date.now();
 if(!Number.isFinite(t))return now;
 return Math.min(t,now+3600000);
}
const byDate=(a,b)=>$("sort").value==="old"?a.pubDate-b.pubDate:b.pubDate-a.pubDate;

async function mapLimit(items,n,fn){
 const out=new Array(items.length);let i=0;
 await Promise.all(Array.from({length:n},async()=>{
  while(i<items.length){const k=i++;out[k]=await fn(items[k]);}
 }));
 return out;
}
function log(s){$("log").style.display="block";$("log").textContent=s}

const TABS=[["all","全部"],["unread","未讀"],["tw","繁體"],["cn","簡體"],["fav","收藏"]];
TABS.forEach(([k,t],i)=>{
 const b=document.createElement("button");
 b.className="tab"+(i?"":" active");
 b.textContent=t;
 b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");filter=k;shown=PAGE;render();
 };
 $("tabs").appendChild(b);
});

function loadSettings(){
 let s={};
 try{s=JSON.parse(localStorage.getItem(SETTINGS)||"{}")}catch(e){}
 $("limit").value=s.limit||"200";
 $("sort").value=s.sort||"new";
 $("size").value=s.size||"25";
 $("auto").value=s.auto||"0";
 applySettings();
}
function applySettings(){
 try{localStorage.setItem(SETTINGS,JSON.stringify({limit:$("limit").value,sort:$("sort").value,size:$("size").value,auto:$("auto").value}))}catch(e){}
 document.documentElement.style.setProperty("--fs",$("size").value+"px");
 clearInterval(autoTimer);
 const m=Number($("auto").value);
 if(m)autoTimer=setInterval(()=>{if(!busy&&!enriching&&navigator.onLine&&!document.hidden)syncNews()},m*60000);
}

function dbInit(){
 return new Promise((res,rej)=>{
  const r=indexedDB.open(DB,1);
  r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:"link"})};
  r.onsuccess=e=>{db=e.target.result;res()};
  r.onerror=()=>rej(r.error);
 });
}
function getAll(){
 return new Promise((res,rej)=>{
  const r=db.transaction(STORE,"readonly").objectStore(STORE).getAll();
  r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);
 });
}
function putMany(list){
 return new Promise((res,rej)=>{
  const tx=db.transaction(STORE,"readwrite"),s=tx.objectStore(STORE);
  list.forEach(a=>{if(a.link)s.put(a)});
  tx.oncomplete=res;tx.onerror=tx.onabort=()=>rej(tx.error);
 });
}
function removeMany(links){
 return new Promise((res,rej)=>{
  const tx=db.transaction(STORE,"readwrite"),s=tx.objectStore(STORE);
  links.forEach(l=>s.delete(l));
  tx.oncomplete=res;tx.onerror=tx.onabort=()=>rej(tx.error);
 });
}

function validURL(url){
 if(!url)return "";
 try{const u=new URL(String(url).trim());return ["https:","http:"].includes(u.protocol)?u.href:""}catch(e){return ""}
}
function stripURL(t){
 return String(t||"").replace(/https?:\/\/[^\s)）\]]+/gi,"").replace(/\(\s*\)|（\s*）|\[\s*\]/g,"").replace(/[ \t]{2,}/g," ").replace(/\n{3,}/g,"\n\n").trim();
}
function clean(html){
 if(!html)return "";
 try{
  const d=new DOMParser().parseFromString(html,"text/html");
  d.querySelectorAll("script,style,iframe,object,form,svg,button,noscript").forEach(x=>x.remove());
  return stripURL((d.body.textContent||"").replace(/\s+/g," ")).slice(0,25000);
 }catch(e){return String(html).replace(/<[^>]*>/g," ").trim().slice(0,25000)}
}
function extractImages(html){
 if(!html)return [];
 const found=[],add=u=>{u=validURL(u);if(u&&!found.includes(u))found.push(u)};
 try{
  const d=new DOMParser().parseFromString(html,"text/html");
  d.querySelectorAll("img").forEach(img=>{
   ["src","data-src","data-original","data-lazy-src","data-original-src","data-url","data-image"].forEach(k=>add(img.getAttribute(k)));
   const ss=img.getAttribute("srcset");
   if(ss)ss.split(",").forEach(p=>add(p.trim().split(/\s+/)[0]));
  });
  d.querySelectorAll('meta[property="og:image"],meta[name="twitter:image"],meta[property="og:image:url"]').forEach(m=>add(m.content));
  d.querySelectorAll("source").forEach(s=>add(s.getAttribute("src")||s.getAttribute("srcset")));
 }catch(e){}
 return found.filter(u=>!/logo|icon|avatar|sprite|pixel|tracking/i.test(u)).slice(0,15);
}
function getLocal(node,name){
 for(const c of Array.from(node.children||[])){
  if(c.localName===name||c.nodeName.endsWith(":"+name))return c.textContent.trim();
 }
 return "";
}
function allLocal(node,name){
 return Array.from(node.getElementsByTagName("*")).filter(x=>x.localName===name||x.nodeName.endsWith(":"+name));
}

function makeArticle(title,link,date,description,source,image,images=[]){
 if(!title||!link)return null;
 link=validURL(link);
 if(!link)return null;
 const imgs=[image,...images].map(validURL).filter(Boolean);
 return {
  title:String(title).trim(),link,pubDate:parseTime(date),
  desc:clean(description)||"目前沒有提供新聞摘要。",
  image:imgs[0]||"",images:[...new Set(imgs)].slice(0,15),
  source:source.name,category:source.type,
  favorite:false,read:false,full:false,failed:0,fullStatus:""
 };
}

function parseXML(xml,source){
 const doc=new DOMParser().parseFromString(xml,"application/xml");
 if(doc.querySelector("parsererror"))throw Error("XML格式錯誤");
 const nodes=[...doc.getElementsByTagName("item"),...doc.getElementsByTagName("entry")];
 return nodes.map(n=>{
  const title=getLocal(n,"title");
  let link=getLocal(n,"link");
  if(!link){
   const l=allLocal(n,"link").find(x=>!x.getAttribute("rel")||x.getAttribute("rel")==="alternate");
   link=l?l.getAttribute("href")||"":"";
  }
  const date=getLocal(n,"pubDate")||getLocal(n,"published")||getLocal(n,"updated");
  const desc=getLocal(n,"description")||getLocal(n,"summary")||getLocal(n,"encoded")||getLocal(n,"content");
  const images=[];
  ["enclosure","content","thumbnail","image","media:content","media:thumbnail"].forEach(t=>{
   allLocal(n,t).forEach(el=>{
    const u=validURL(el.getAttribute("url")||el.getAttribute("href")||el.getAttribute("src")||el.textContent);
    if(u&&!images.includes(u))images.push(u);
   });
  });
  extractImages(desc).forEach(u=>{if(!images.includes(u))images.push(u)});
  return makeArticle(title,link,date,desc,source,images[0]||"",images);
 }).filter(Boolean);
}

async function request(url,headers={},timeout=25000){
 const c=new AbortController(),t=setTimeout(()=>c.abort(),timeout);
 try{
  const r=await fetch(url,{signal:c.signal,cache:"no-store",headers});
  if(!r.ok)throw Error("HTTP "+r.status);
  return await r.text();
 }catch(e){
  throw Error(e.name==="AbortError"?"逾時":e.message);
 }finally{clearTimeout(t)}
}

async function viaJSON(source){
 const data=JSON.parse(await request("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(source.url)));
 if(data.status!=="ok"||!Array.isArray(data.items))throw Error(data.message||"RSS2JSON錯誤");
 return data.items.map(x=>{
  const html=x.content||x.description||"";
  const imgs=[x.thumbnail,x.enclosure&&x.enclosure.link,x.enclosure&&x.enclosure.url,x.image,...extractImages(html)].map(validURL).filter(Boolean);
  return makeArticle(x.title,x.link,x.pubDate,html,source,imgs[0]||"",imgs);
 }).filter(Boolean);
}
function proxyFn(label,mk,json){
 const f=async source=>{
  let xml=await request(mk(encodeURIComponent(source.url)));
  if(json)xml=JSON.parse(xml).contents||"";
  if(!xml.includes("<")||xml.length<100)throw Error("沒有有效XML");
  return parseXML(xml,source);
 };
 f.label=label;return f;
}
viaJSON.label="rss2json";
const PROXIES=[
 viaJSON,
 proxyFn("allorigins",u=>"https://api.allorigins.win/raw?url="+u),
 proxyFn("corsproxy",u=>"https://corsproxy.io/?"+u),
 proxyFn("allorigins-get",u=>"https://api.allorigins.win/get?url="+u,true),
 proxyFn("codetabs",u=>"https://api.codetabs.com/v1/proxy?quest="+u),
 proxyFn("thingproxy",u=>"https://thingproxy.freeboard.io/fetch/"+decodeURIComponent(u))
];
async function fetchSource(source){
 const errors=[];
 for(const fn of PROXIES){
  try{
   const list=await fn(source);
   if(list.length)return {ok:true,list};
   errors.push(fn.label+":沒有新聞");
  }catch(e){errors.push(fn.label+":"+e.message)}
 }
 return {ok:false,error:"\n   "+errors.join("\n   ")};
}

function extractMarkdownImages(text){
 const images=[],re=/!\[[^\]]*\]\((https?:\/\/[^)\s]+)(?:\s+"[^"]*")?\)/gi;
 let m;
 while((m=re.exec(text))!==null){const u=validURL(m[1]);if(u&&!images.includes(u))images.push(u)}
 return images;
}
function cleanReaderText(text){
 return stripURL(String(text||"")
  .replace(/^(Title|URL Source|Published Time|Markdown Content):.*$/gim,"")
  .replace(/!\[([^\]]*)\]\([^)]+\)/g,"")
  .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,"$1")
  .replace(/^#{1,6}\s*/gm,"")
  .replace(/^\s*[-*_]{3,}\s*$/gm,"")
  .replace(/\n{3,}/g,"\n\n")).slice(0,25000);
}
async function readFullArticle(a){
 const text=await request("https://r.jina.ai/"+a.link,{"Accept":"text/plain","X-Respond-With":"markdown","X-Retain-Images":"all","X-Timeout":"25"},35000);
 if(!text||text.length<150)throw Error("擷取內容太短");
 const content=cleanReaderText(text);
 if(content.length<150)throw Error("沒有取得有效內文");
 const images=extractMarkdownImages(text).filter(u=>!/logo|icon|avatar|sprite|pixel/i.test(u));
 return {desc:content,image:images[0]||a.image,images};
}

function scheduleRender(){
 if(renderTimer)return;
 renderTimer=setTimeout(()=>{renderTimer=null;render()},700);
}

async function enrichArticles(list,force=false){
 if(enriching||!navigator.onLine)return;
 enriching=true;
 /* 最新的新聞優先擷取全文 */
 const targets=list.filter(a=>!a.full&&a.link&&(force||!a.failed||a.failed<2))
  .sort((a,b)=>b.pubDate-a.pubDate).slice(0,FULL_LIMIT);
 let ok=0,fail=0,done=0,idx=0;
 log("正在擷取最新新聞全文及照片...\n準備處理 "+targets.length+" 則");
 async function worker(){
  while(idx<targets.length){
   const a=targets[idx++];
   try{
    const r=await readFullArticle(a);
    a.desc=r.desc;a.full=true;a.failed=0;a.fullStatus="✓ 已取得完整內文";
    if(r.image)a.image=r.image;
    a.images=[...new Set([...(a.images||[]),...r.images])].slice(0,15);
    ok++;
   }catch(e){
    a.failed=(a.failed||0)+1;
    a.fullStatus="未取得全文，保留RSS摘要："+e.message;
    fail++;
   }
   done++;
   try{await putMany([a])}catch(e){}
   scheduleRender();
   log("全文擷取進度："+done+"/"+targets.length+"\n成功："+ok+"　失敗："+fail);
  }
 }
 try{
  await Promise.all([worker(),worker(),worker()]);
  log("全文擷取完成！\n成功："+ok+" 則　失敗："+fail+" 則\n未取得全文的新聞仍保留原有摘要。");
 }finally{
  enriching=false;
  render();
 }
}

function mergeArticles(incoming){
 const map=new Map(articles.map(a=>[a.link,a]));
 incoming.forEach(a=>{
  const old=map.get(a.link);
  if(old){
   map.set(a.link,{
    ...old,
    pubDate:Math.min(old.pubDate,a.pubDate),
    image:old.image||a.image,
    images:[...new Set([...(old.images||[]),...(a.images||[])])].slice(0,15),
    desc:old.full?old.desc:(a.desc||old.desc)
   });
  }else map.set(a.link,a);
 });
 return Array.from(map.values()).sort((a,b)=>b.pubDate-a.pubDate);
}

async function syncNews(){
 if(busy)return;
 if(!navigator.onLine){alert("請先連接網路");return}
 busy=true;
 $("sync").disabled=true;
 $("sync").textContent="⏳ 正在抓取...";
 try{
  log("正在連接 "+SOURCES.length+" 個來源...");
  const results=await mapLimit(SOURCES,4,s=>fetchSource(s).then(r=>({s,r})));
  const incoming=[],report=[];
  results.forEach(({s,r})=>{
   if(r.ok){incoming.push(...r.list);report.push("✓ "+s.name+"："+r.list.length+"則")}
   else report.push("✗ "+s.name+"："+r.error);
  });
  if(!incoming.length){
   log("所有來源均無法取得。\n\n"+report.join("\n")+"\n\n原有資料沒有刪除。");
   return;
  }
  const all=mergeArticles(incoming);
  const limit=$("limit").value,keep=[],drop=[];
  let n=0;
  all.forEach(a=>{
   if(a.favorite||limit==="all"||n<Number(limit)){keep.push(a);if(!a.favorite)n++}
   else drop.push(a);
  });
  articles=keep;
  await putMany(articles);
  if(drop.length)await removeMany(drop.map(a=>a.link));
  render();
  log("RSS更新完成！\n\n"+report.join("\n")+"\n\n本次取得："+incoming.length+"則\n保存："+articles.length+"則\n開始擷取全文及照片...");
  await enrichArticles(articles);
 }catch(e){
  log("更新錯誤："+e.message+"\n原有新聞仍保留。");
 }finally{
  busy=false;
  $("sync").disabled=false;
  $("sync").textContent="⟳ 開始更新新聞";
 }
}

async function testSources(){
 if(busy)return;
 if(!navigator.onLine){alert("請先連接網路");return}
 busy=true;
 $("test").disabled=true;
 $("test").textContent="測試中...";
 try{
  log("正在測試來源...");
  const res=await mapLimit(SOURCES,4,s=>fetchSource(s).then(r=>r.ok?"✓ "+s.name+"："+r.list.length+"則":"✗ "+s.name+"："+r.error));
  log("新聞來源測試結果：\n\n"+res.join("\n"));
 }finally{
  busy=false;
  $("test").disabled=false;
  $("test").textContent="🔧 測試來源";
 }
}

function updateStats(){
 $("total").textContent=articles.length;
 $("favCount").textContent=articles.filter(a=>a.favorite).length;
 const d=new Date(),start=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
 $("today").textContent=articles.filter(a=>a.pubDate>=start).length;
}
function dateText(t){
 const d=new Date(t);
 return isNaN(d.getTime())?"日期不明":d.toLocaleString("zh-TW");
}
function el(tag,cls,txt){
 const x=document.createElement(tag);
 if(cls)x.className=cls;
 if(txt!==undefined)x.textContent=txt;
 return x;
}

function showPhoto(url){
 const s=validURL(url);
 if(!s)return;
 $("largePhoto").src=s;
 $("photoModal").style.display="flex";
}
function closePhoto(){
 $("photoModal").style.display="none";
 $("largePhoto").removeAttribute("src");
}
$("closePhoto").onclick=closePhoto;
$("photoModal").onclick=e=>{if(e.target===$("photoModal"))closePhoto()};

async function persist(a){try{await putMany([a])}catch(e){}}

function getImageCandidates(a){
 const result=[];
 [a.image,...(a.images||[])].forEach(u=>{
  u=validURL(u);
  if(!u)return;
  if(!result.includes(u))result.push(u);
  try{
   const p=new URL(u);
   const proxy="https://images.weserv.nl/?url="+encodeURIComponent(p.host+p.pathname+p.search);
   if(!result.includes(proxy))result.push(proxy);
  }catch(e){}
 });
 return result;
}

function buildCard(a){
 const isGoogle=(a.source||"").startsWith("Google");
 const isFinance=(a.source||"").includes("財經");
 const card=el("article","card open"+(a.read?" read":"")+(isGoogle?" google":""));
 const meta=el("div","meta");
 const left=el("span","tag",a.source);
 if(isFinance)left.classList.add("finance-label");
 meta.append(left,el("span","",dateText(a.pubDate)));

 const headline=el("div","headline-row"),titleBox=el("div","headline-title"),h3=el("h3","",a.title);
 const imgs=getImageCandidates(a);
 if(imgs.length){
  const img=el("img","news-thumb");
  let i=0;
  img.alt=a.title;img.loading="lazy";img.decoding="async";img.referrerPolicy="no-referrer";
  img.onerror=()=>{
   i++;
   if(i<imgs.length)img.src=imgs[i];
   else{const p=el("div","thumb-placeholder","✦");img.replaceWith(p)}
  };
  img.onclick=()=>showPhoto(img.src);
  img.src=imgs[0];
  headline.appendChild(img);
 }else headline.appendChild(el("div","thumb-placeholder","✦"));
 titleBox.appendChild(h3);
 headline.appendChild(titleBox);

 const body=el("div","body");
 card.append(meta,headline,body);
 h3.onclick=()=>{
  card.classList.toggle("open");
  if(card.classList.contains("open"))card.scrollIntoView({block:"nearest",behavior:"smooth"});
 };

 if(imgs.length){
  const img=el("img","news-image");
  let i=0;
  img.alt=a.title;img.loading="lazy";img.decoding="async";img.referrerPolicy="no-referrer";
  img.onerror=()=>{i++;if(i<imgs.length)img.src=imgs[i];else img.remove()};
  img.onclick=()=>showPhoto(img.src);
  img.src=imgs[0];
  body.appendChild(img);
 }
 body.appendChild(el("div","desc",stripURL(a.desc)||"目前沒有可顯示的內文。"));
 if((a.fullStatus||"").startsWith("未取得"))body.appendChild(el("div","article-status",a.fullStatus));

 const actions=el("div","actions");
 const toggle=el("button","",a.read?"標為未讀":"標為已讀");
 toggle.onclick=()=>{
  a.read=!a.read;
  card.classList.toggle("read",a.read);
  toggle.textContent=a.read?"標為未讀":"標為已讀";
  persist(a);updateStats();
  if(filter==="unread")render();
 };
 const star=el("button","star",a.favorite?"★ 已收藏":"☆ 收藏");
 star.onclick=()=>{
  a.favorite=!a.favorite;
  star.textContent=a.favorite?"★ 已收藏":"☆ 收藏";
  persist(a);updateStats();
  if(filter==="fav")render();
 };
 actions.append(toggle,star);
 if(navigator.share){
  const sh=el("button","","分享");
  sh.onclick=()=>navigator.share({title:a.title,url:a.link}).catch(()=>{});
  actions.append(sh);
 }
 body.appendChild(actions);
 return card;
}

/* 顯示：純依日期排序，最新在最上 */
function render(){
 updateStats();
 const box=$("news"),kw=$("search").value.trim().toLowerCase();
 const list=articles.filter(a=>{
  if(filter==="tw"&&a.category!=="tw")return false;
  if(filter==="cn"&&a.category!=="cn")return false;
  if(filter==="fav"&&!a.favorite)return false;
  if(filter==="unread"&&a.read)return false;
  return !kw||(a.title+" "+a.desc+" "+a.source).toLowerCase().includes(kw);
 }).sort(byDate);

 box.replaceChildren();
 if(!list.length){
  box.appendChild(el("div","empty","目前沒有符合條件的新聞"));
  $("more").style.display="none";
  return;
 }
 const showAll=$("limit").value==="all";
 const count=showAll?list.length:shown;
 const frag=document.createDocumentFragment();
 list.slice(0,count).forEach(a=>frag.appendChild(buildCard(a)));
 box.appendChild(frag);
 const more=!showAll&&list.length>shown;
 $("more").style.display=more?"block":"none";
 if(more)$("moreBtn").textContent="載入更多（還有 "+(list.length-shown)+" 則）";
}

const topFloat=$("topFloat");
window.addEventListener("scroll",()=>{topFloat.classList.toggle("hidden",window.scrollY<180)},{passive:true});
topFloat.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});

$("sync").onclick=syncNews;
$("test").onclick=testSources;
$("retry").onclick=()=>{
 if(busy||enriching)return;
 articles.forEach(a=>{if(!a.full)a.failed=0});
 enrichArticles(articles,true);
};
$("moreBtn").onclick=()=>{shown+=PAGE;render()};
let st;
$("search").oninput=()=>{clearTimeout(st);st=setTimeout(()=>{shown=PAGE;render()},250)};
$("sort").onchange=()=>{applySettings();shown=PAGE;render()};
$("size").onchange=()=>{applySettings();render()};
$("auto").onchange=applySettings;
$("limit").onchange=()=>{
 applySettings();shown=PAGE;render();
 log($("limit").value==="all"?"已切換全部新聞顯示模式。":"已變更保存數量。下次更新時依新設定整理新聞。");
};

function setNet(){
 const on=navigator.onLine;
 $("status").textContent=on?"● 網路已連線":"○ 離線閱讀模式";
 $("status").className="status"+(on?"":" offline");
}
window.addEventListener("online",setNet);
window.addEventListener("offline",setNet);

async function start(){
 loadSettings();
 try{
  await dbInit();
  articles=await getAll();
  const fix=[];
  articles.forEach(a=>{
   if(!Array.isArray(a.images))a.images=a.image?[a.image]:[];
   const t=parseTime(a.pubDate);
   if(t!==a.pubDate){a.pubDate=t;fix.push(a)}
  });
  if(fix.length)putMany(fix).catch(()=>{});
  setNet();
  render();
  if(!articles.length&&navigator.onLine)await syncNews();
  else log("本機新聞載入完成，共 "+articles.length+" 則，依日期由新到舊排列。");
 }catch(e){
  log("資料庫啟動失敗："+e.message);
 }
}
start();
</script>
