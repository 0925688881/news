<script>
"use strict";

const DB="RobustChineseNewsDB";
const STORE="articles";
const FULL_LIMIT=100;
const PAGE=30;
const SETTINGS="nexusNewsSettings";
const OFFLINE_LIMIT=200;
const MAX_IMAGE_BYTES=8*1024*1024;

let db,articles=[],filter="all",busy=false,enriching=false;
let offlineBusy=false,shown=PAGE,autoTimer=null,renderTimer=null;
let offlineObjectURLs=new Map();
let searchTimer=null;

const $=id=>document.getElementById(id);
const G="https://news.google.com/rss";
const Q="?hl=zh-TW&gl=TW&ceid=TW:zh-Hant";

const SOURCES=[
 {name:"Google 繁體財經",type:"tw",url:G+"/search?q=%E8%B2%A1%E7%B6%93+OR+%E8%82%A1%E5%B8%82+OR+%E5%8F%B0%E8%82%A1+OR+%E7%BE%8E%E8%82%A1&hl=zh-TW&gl=TW&ceid=TW:zh-Hant"},
 {name:"Google 繁體新聞",type:"tw",url:G+Q},
 {name:"Google 國際",type:"tw",url:G+"/headlines/section/topic/WORLD"+Q},
 {name:"Google 科技",type:"tw",url:G+"/headlines/section/topic/TECHNOLOGY"+Q},
 {name:"Google 健康",type:"tw",url:G+"/headlines/section/topic/HEALTH"+Q},
 {name:"Google 娛樂",type:"tw",url:G+"/headlines/section/topic/ENTERTAINMENT"+Q},
 {name:"Google 體育",type:"tw",url:G+"/headlines/section/topic/SPORTS"+Q},
 {name:"Google 簡體新聞",type:"cn",url:G+"?hl=zh-CN&gl=CN&ceid=CN:zh-Hans"},
 {name:"自由時報",type:"tw",url:"https://news.ltn.com.tw/rss/all.xml"},
 {name:"中央社",type:"tw",url:"https://feeds.feedburner.com/rsscna/main"},
 {name:"公視新聞",type:"tw",url:"https://about.pts.org.tw/rss/XML/newsfeed.xml"},
 {name:"中時新聞網",type:"tw",url:"https://www.chinatimes.com/rss/realtimenews.xml"}
];

/* 日期 */
function parseTime(d){
 let t=NaN;
 if(typeof d==="number")t=d;
 else if(d){
  let s=String(d).trim();
  if(/^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$/.test(s))s=s.replace(" ","T")+"Z";
  t=new Date(s).getTime();
 }
 const now=Date.now();
 if(!Number.isFinite(t))return now;
 return Math.min(t,now+3600000);
}
const byDate=(a,b)=>$("sort").value==="old"
 ?a.pubDate-b.pubDate
 :b.pubDate-a.pubDate;

async function mapLimit(items,n,fn){
 const out=new Array(items.length);
 let i=0;
 await Promise.all(Array.from({length:n},async()=>{
  while(i<items.length){
   const k=i++;
   try{out[k]=await fn(items[k])}
   catch(e){out[k]=null}
  }
 }));
 return out;
}

function log(s){
 $("log").style.display="block";
 $("log").textContent=s;
}

function setProgress(done,total){
 const pct=total?Math.round(done/total*100):0;
 $("offlineProgress").style.width=pct+"%";
}

const TABS=[
 ["all","全部"],
 ["unread","未讀"],
 ["tw","繁體"],
 ["cn","簡體"],
 ["fav","收藏"],
 ["offline","離線"]
];

TABS.forEach(([k,t],i)=>{
 const b=document.createElement("button");
 b.className="tab"+(i?"":" active");
 b.textContent=t;
 b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  filter=k;
  shown=PAGE;
  render();
 };
 $("tabs").appendChild(b);
});

/* 設定 */
function loadSettings(){
 let s={};
 try{s=JSON.parse(localStorage.getItem(SETTINGS)||"{}")}catch(e){}
 $("limit").value=s.limit||"200";
 $("sort").value=s.sort||"new";
 $("size").value=s.size||"25";
 $("auto").value=s.auto||"0";
 applySettings();
}

function applySettings(){
 try{
  localStorage.setItem(SETTINGS,JSON.stringify({
   limit:$("limit").value,
   sort:$("sort").value,
   size:$("size").value,
   auto:$("auto").value
  }));
 }catch(e){}
 document.documentElement.style.setProperty("--fs",$("size").value+"px");
 clearInterval(autoTimer);
 const m=Number($("auto").value);
 if(m){
  autoTimer=setInterval(()=>{
   if(!busy&&!enriching&&!offlineBusy&&navigator.onLine&&!document.hidden)syncNews();
  },m*60000);
 }
}

/* IndexedDB：沿用8.2資料庫及版本，不刪除舊資料 */
function dbInit(){
 return new Promise((res,rej)=>{
  const r=indexedDB.open(DB,1);
  r.onupgradeneeded=e=>{
   const d=e.target.result;
   if(!d.objectStoreNames.contains(STORE)){
    d.createObjectStore(STORE,{keyPath:"link"});
   }
  };
  r.onsuccess=e=>{
   db=e.target.result;
   db.onversionchange=()=>db.close();
   res();
  };
  r.onerror=()=>rej(r.error);
 });
}

function getAll(){
 return new Promise((res,rej)=>{
  const r=db.transaction(STORE,"readonly").objectStore(STORE).getAll();
  r.onsuccess=()=>res(r.result||[]);
  r.onerror=()=>rej(r.error);
 });
}

function putMany(list){
 return new Promise((res,rej)=>{
  if(!list.length){res();return}
  const tx=db.transaction(STORE,"readwrite");
  const s=tx.objectStore(STORE);
  list.forEach(a=>{if(a&&a.link)s.put(a)});
  tx.oncomplete=()=>res();
  tx.onerror=tx.onabort=()=>rej(tx.error||new Error("資料保存失敗"));
 });

}

function removeMany(links){
 return new Promise((res,rej)=>{
  if(!links.length){res();return}
  const tx=db.transaction(STORE,"readwrite");
  const s=tx.objectStore(STORE);
  links.forEach(l=>s.delete(l));
  tx.oncomplete=()=>res();
  tx.onerror=tx.onabort=()=>rej(tx.error);
 });
}

/* URL與文字處理 */
function validURL(url){
 if(!url)return "";
 try{
  const u=new URL(String(url).trim());
  return ["https:","http:"].includes(u.protocol)?u.href:"";
 }catch(e){return ""}
}

function stripURL(t){
 return String(t||"")
  .replace(/https?:\/\/[^\s)）\]]+/gi,"")
  .replace(/\(\s*\)|（\s*）|\[\s*\]/g,"")
  .replace(/[ \t]{2,}/g," ")
  .replace(/\n{3,}/g,"\n\n")
  .trim();
}

function clean(html){
 if(!html)return "";
 try{
  const d=new DOMParser().parseFromString(html,"text/html");
  d.querySelectorAll("script,style,iframe,object,form,svg,button,noscript").forEach(x=>x.remove());
  return stripURL((d.body.textContent||"").replace(/\s+/g," ")).slice(0,25000);
 }catch(e){
  return String(html).replace(/<[^>]*>/g," ").trim().slice(0,25000);
 }
}

function extractImages(html){
 if(!html)return [];
 const found=[];
 const add=u=>{
  u=validURL(u);
  if(u&&!found.includes(u))found.push(u);
 };
 try{
  const d=new DOMParser().parseFromString(html,"text/html");
  d.querySelectorAll("img").forEach(img=>{
   ["src","data-src","data-original","data-lazy-src","data-original-src","data-url","data-image"].forEach(k=>add(img.getAttribute(k)));
   const ss=img.getAttribute("srcset");
   if(ss)ss.split(",").forEach(p=>add(p.trim().split(/\s+/)[0]));
  });
  d.querySelectorAll('meta[property="og:image"],meta[name="twitter:image"],meta[property="og:image:url"]').forEach(m=>add(m.content));
  d.querySelectorAll("source").forEach(s=>add(s.getAttribute("src")||s.getAttribute("srcset")));
 }catch(e){}
 return found.filter(u=>!/logo|icon|avatar|sprite|pixel|tracking/i.test(u)).slice(0,15);
}

function getLocal(node,name){
 for(const c of Array.from(node.children||[])){
  if(c.localName===name||c.nodeName.endsWith(":"+name))return c.textContent.trim();
 }
 return "";
}

function allLocal(node,name){
 return Array.from(node.getElementsByTagName("*"))
  .filter(x=>x.localName===name||x.nodeName.endsWith(":"+name));
}

function makeArticle(title,link,date,description,source,image,images=[]){
 if(!title||!link)return null;
 link=validURL(link);
 if(!link)return null;
 const imgs=[image,...images].map(validURL).filter(Boolean);
 return {
  title:String(title).trim(),
  link,
  pubDate:parseTime(date),
  desc:clean(description)||"目前沒有提供新聞摘要。",
  image:imgs[0]||"",
  images:[...new Set(imgs)].slice(0,15),
  source:source.name,
  category:source.type,
  favorite:false,
  read:false,
  full:false,
  failed:0,
  fullStatus:"",
  offlineSaved:false,
  offlineImages:[]
 };
}

/* RSS解析 */
function parseXML(xml,source){
 const doc=new DOMParser().parseFromString(xml,"application/xml");
 if(doc.querySelector("parsererror"))throw Error("XML格式錯誤");
 const nodes=[
  ...doc.getElementsByTagName("item"),
  ...doc.getElementsByTagName("entry")
 ];
 return nodes.map(n=>{
  const title=getLocal(n,"title");
  let link=getLocal(n,"link");
  if(!link){
   const l=allLocal(n,"link").find(x=>!x.getAttribute("rel")||x.getAttribute("rel")==="alternate");
   link=l?l.getAttribute("href")||"":"";
  }
  const date=getLocal(n,"pubDate")||getLocal(n,"published")||getLocal(n,"updated");
  const desc=getLocal(n,"description")||getLocal(n,"summary")||getLocal(n,"encoded")||getLocal(n,"content");
  const images=[];
  ["enclosure","content","thumbnail","image","media:content","media:thumbnail"].forEach(t=>{
   allLocal(n,t).forEach(el=>{
    const u=validURL(el.getAttribute("url")||el.getAttribute("href")||el.getAttribute("src")||el.textContent);
    if(u&&!images.includes(u))images.push(u);
   });
  });
  extractImages(desc).forEach(u=>{
   if(!images.includes(u))images.push(u);
  });
  return makeArticle(title,link,date,desc,source,images[0]||"",images);
 }).filter(Boolean);
}

async function request(url,headers={},timeout=25000){
 const c=new AbortController();
 const t=setTimeout(()=>c.abort(),timeout);
 try{
  const r=await fetch(url,{
   signal:c.signal,
   cache:"no-store",
   headers
  });
  if(!r.ok)throw Error("HTTP "+r.status);
  return await r.text();
 }catch(e){
  throw Error(e.name==="AbortError"?"逾時":e.message);
 }finally{
  clearTimeout(t);
 }
}

async function viaJSON(source){
 const data=JSON.parse(await request(
  "https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(source.url)
 ));
 if(data.status!=="ok"||!Array.isArray(data.items)){
  throw Error(data.message||"RSS2JSON錯誤");
 }
 return data.items.map(x=>{
  const html=x.content||x.description||"";
  const imgs=[
   x.thumbnail,
   x.enclosure&&x.enclosure.link,
   x.enclosure&&x.enclosure.url,
   x.image,
   ...extractImages(html)
  ].map(validURL).filter(Boolean);
  return makeArticle(x.title,x.link,x.pubDate,html,source,imgs[0]||"",imgs);
 }).filter(Boolean);
}

function proxyFn(label,mk,json){
 const f=async source=>{
  let xml=await request(mk(encodeURIComponent(source.url)));
  if(json)xml=JSON.parse(xml).contents||"";
  if(!xml.includes("<")||xml.length<100)throw Error("沒有有效XML");
  return parseXML(xml,source);
 };
 f.label=label;
 return f;
}

viaJSON.label="rss2json";

const PROXIES=[
 viaJSON,
 proxyFn("allorigins",u=>"https://api.allorigins.win/raw?url="+u),
 proxyFn("corsproxy",u=>"https://corsproxy.io/?"+u),
 proxyFn("allorigins-get",u=>"https://api.allorigins.win/get?url="+u,true),
 proxyFn("codetabs",u=>"https://api.codetabs.com/v1/proxy?quest="+u),
 proxyFn("thingproxy",u=>"https://thingproxy.freeboard.io/fetch/"+decodeURIComponent(u))
];

async function fetchSource(source){
 const errors=[];
 for(const fn of PROXIES){
  try{
   const list=await fn(source);
   if(list.length)return {ok:true,list};
   errors.push(fn.label+":沒有新聞");
  }catch(e){
   errors.push(fn.label+":"+e.message);
  }
 }
 return {ok:false,error:"\n   "+errors.join("\n   ")};
}

/* 全文擷取 */
function extractMarkdownImages(text){
 const images=[];
 const re=/!\[[^\]]*\]\((https?:\/\/[^)\s]+)(?:\s+"[^"]*")?\)/gi;
 let m;
 while((m=re.exec(text))!==null){
  const u=validURL(m[1]);
  if(u&&!images.includes(u))images.push(u);
 }
 return images;
}

function cleanReaderText(text){
 return stripURL(String(text||"")
  .replace(/^(Title|URL Source|Published Time|Markdown Content):.*$/gim,"")
  .replace(/!\[([^\]]*)\]\([^)]+\)/g,"")
  .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,"$1")
  .replace(/^#{1,6}\s*/gm,"")
  .replace(/^\s*[-*_]{3,}\s*$/gm,"")
  .replace(/\n{3,}/g,"\n\n")
 ).slice(0,25000);
}

async function readFullArticle(a){
 const text=await request(
  "https://r.jina.ai/"+a.link,
  {
   "Accept":"text/plain",
   "X-Respond-With":"markdown",
   "X-Retain-Images":"all",
   "X-Timeout":"25"
  },
  35000
 );
 if(!text||text.length<150)throw Error("擷取內容太短");
 const content=cleanReaderText(text);
 if(content.length<150)throw Error("沒有取得有效內文");
 const images=extractMarkdownImages(text).filter(u=>!/logo|icon|avatar|sprite|pixel/i.test(u));
 return {
  desc:content,
  image:images[0]||a.image,
  images
 };
}

function scheduleRender(){
 if(renderTimer)return;
 renderTimer=setTimeout(()=>{
  renderTimer=null;
  render();
 },700);
}

async function enrichArticles(list,force=false){
 if(enriching||!navigator.onLine)return;
 enriching=true;

 const targets=list
  .filter(a=>!a.full&&a.link&&(force||!a.failed||a.failed<2))
  .sort((a,b)=>b.pubDate-a.pubDate)
  .slice(0,FULL_LIMIT);

 let ok=0,fail=0,done=0,idx=0;
 log("正在擷取最新新聞全文及照片...\n準備處理 "+targets.length+" 則");

 async function worker(){
  while(idx<targets.length){
   const a=targets[idx++];
   try{
    const r=await readFullArticle(a);
    a.desc=r.desc;
    a.full=true;
    a.failed=0;
    a.fullStatus="✓ 已取得完整內文";
    if(r.image)a.image=r.image;
    a.images=[...new Set([...(a.images||[]),...r.images])].slice(0,15);
    ok++;
   }catch(e){
    a.failed=(a.failed||0)+1;
    a.fullStatus="未取得全文，保留RSS摘要："+e.message;
    fail++;
   }
   done++;
   try{await putMany([a])}catch(e){}
   scheduleRender();
   log("全文擷取進度："+done+"/"+targets.length+"\n成功："+ok+"　失敗："+fail);
  }
 }

 try{
  await Promise.all([worker(),worker(),worker()]);
  log("全文擷取完成！\n成功："+ok+" 則　失敗："+fail+" 則\n接著自動保存最新200則新聞及照片。");
 }finally{
  enriching=false;
  render();
 }
}

/* 合併新聞：保留收藏、已讀、全文及離線照片 */
function mergeArticles(incoming){
 const map=new Map(articles.map(a=>[a.link,a]));

 incoming.forEach(a=>{
  const old=map.get(a.link);

  if(old){
   map.set(a.link,{
    ...a,
    ...old,
    pubDate:Math.max(old.pubDate||0,a.pubDate||0),
    image:old.image||a.image,
    images:[...new Set([...(old.images||[]),...(a.images||[])])].slice(0,15),
    desc:old.full?old.desc:(a.desc||old.desc),
    favorite:!!(old.favorite||a.favorite),
    read:!!old.read,
    full:!!old.full,
    failed:old.full?0:(old.failed||0),
    fullStatus:old.fullStatus||a.fullStatus||"",
    offlineSaved:!!old.offlineSaved,
    offlineImages:Array.isArray(old.offlineImages)?old.offlineImages:[]
   });
  }else{
   map.set(a.link,a);
  }
 });

 return Array.from(map.values()).sort((a,b)=>b.pubDate-a.pubDate);
}

/* 更新RSS */
async function syncNews(){
 if(busy)return;
 if(!navigator.onLine){
  alert("目前沒有網路，請連線後再更新新聞。");
  return;
 }

 busy=true;
 $("sync").disabled=true;
 $("sync").textContent="⏳ 正在抓取...";

 try{
  log("正在連接 "+SOURCES.length+" 個新聞來源...");

  const results=await mapLimit(SOURCES,4,s=>
   fetchSource(s).then(r=>({s,r}))
  );

  const incoming=[],report=[];

  results.forEach(({s,r})=>{
   if(r&&r.ok){
    incoming.push(...r.list);
    report.push("✓ "+s.name+"："+r.list.length+"則");
   }else{
    report.push("✗ "+s.name+"："+(r?r.error:"連線失敗"));
   }
  });

  if(!incoming.length){
   log("所有來源均無法取得。\n\n"+report.join("\n")+"\n\n原有資料沒有刪除。");
   return;
  }

  const all=mergeArticles(incoming);
  const limit=$("limit").value;
  const keep=[],drop=[];
  let n=0;

  /* 離線固定需要最新200則，因此一般保存設定低於200時也保留200筆底層資料 */
  const retention=limit==="all"?Infinity:Math.max(OFFLINE_LIMIT,Number(limit)||200);

  all.forEach(a=>{
   if(a.favorite||n<retention){
    keep.push(a);
    if(!a.favorite)n++;
   }else{
    drop.push(a);
   }
  });

  articles=keep;
  await putMany(articles);

  if(drop.length){
   await removeMany(drop.map(a=>a.link));
  }

  render();

  log(
   "RSS更新完成！\n\n"+
   report.join("\n")+
   "\n\n本次取得："+incoming.length+"則"+
   "\n一般保存設定："+limit+"則"+
   "\n實際保留："+articles.length+"則（離線保存需要至少200則）"+
   "\n開始擷取全文..."
  );

  await enrichArticles(articles);

  if(!offlineBusy&&navigator.onLine){
   await autoSaveLatestOffline();
  }

 }catch(e){
  log("更新錯誤："+e.message+"\n原有資料仍保留。");
 }finally{
  busy=false;
  $("sync").disabled=false;
  $("sync").textContent="⟳ 開始更新新聞";
 }
}

/* 離線照片處理 */
function getImageCandidates(a){
 const result=[];
 [a.image,...(a.images||[])].forEach(u=>{
  u=validURL(u);
  if(!u)return;
  if(!result.includes(u))result.push(u);
  try{
   const p=new URL(u);
   const proxy="https://images.weserv.nl/?url="+encodeURIComponent(p.host+p.pathname+p.search);
   if(!result.includes(proxy))result.push(proxy);
  }catch(e){}
 });
 return result;
}

async function fetchImageBlob(url){
 const c=new AbortController();
 const timer=setTimeout(()=>c.abort(),18000);
 try{
  const r=await fetch(url,{method:"GET",mode:"cors",cache:"force-cache",signal:c.signal});
  if(!r.ok)throw Error("HTTP "+r.status);
  const type=(r.headers.get("content-type")||"").toLowerCase();
  if(type&&!type.startsWith("image/"))throw Error("回傳內容不是圖片");
  const blob=await r.blob();
  if(!blob||!blob.size)throw Error("圖片內容為空");
  if(blob.size>MAX_IMAGE_BYTES)throw Error("圖片超過8MB");
  if(blob.type&&!blob.type.startsWith("image/"))throw Error("圖片格式不支援");
  return blob;
 }catch(e){
  throw Error(e.name==="AbortError"?"照片下載逾時":e.message);
 }finally{
  clearTimeout(timer);
 }
}

async function saveArticlePhoto(a){
 if(!navigator.onLine)throw Error("目前離線");
 if(Array.isArray(a.offlineImages)&&a.offlineImages.some(x=>x&&x.blob&&x.blob.size)){
  return {ok:true,existing:true};
 }
 const candidates=getImageCandidates(a);
 if(!candidates.length)throw Error("沒有可下載的照片網址");
 const errors=[];
 for(const url of candidates.slice(0,6)){
  try{
   const blob=await fetchImageBlob(url);
   a.offlineImages=[{url:url,blob:blob,savedAt:Date.now()}];
   a.offlineImageSaved=true;
   a.offlineImageError="";
   await putMany([a]);
   return {ok:true,size:blob.size,url};
  }catch(e){errors.push(e.message)}
 }
 a.offlineImageSaved=false;
 a.offlineImageError=errors.join(" / ").slice(0,300);
 await putMany([a]).catch(()=>{});
 throw Error(a.offlineImageError||"照片下載失敗");
}

async function autoSaveLatestOffline(){
 if(offlineBusy||!db)return;
 offlineBusy=true;
 try{
  const sorted=[...articles].sort((a,b)=>b.pubDate-a.pubDate);
  const targets=sorted.slice(0,OFFLINE_LIMIT);
  if(!targets.length){
   $("offlineSummary").textContent="離線保存：目前沒有新聞";
   setProgress(0,0);
   return;
  }
  targets.forEach(a=>{
   a.offlineSaved=true;
   if(!Array.isArray(a.offlineImages))a.offlineImages=[];
  });
  await putMany(targets);

  const targetLinks=new Set(targets.map(a=>a.link));
  const oldOffline=articles.filter(a=>a.offlineSaved&&!targetLinks.has(a.link));
  for(const a of oldOffline){
   a.offlineSaved=false;
   a.offlineImages=[];
   a.offlineImageSaved=false;
   a.offlineImageError="";
  }
  if(oldOffline.length)await putMany(oldOffline);

  const needPhotos=targets.filter(a=>!(
   Array.isArray(a.offlineImages)&&a.offlineImages.some(x=>x&&x.blob&&x.blob.size)
  ));
  let done=0,success=0,failed=0,bytes=0;
  const already=targets.length-needPhotos.length;
  $("offlineSummary").textContent="離線保存：文字 "+targets.length+" 則，照片準備下載 "+needPhotos.length+" 張";
  setProgress(already,targets.length);

  if(!navigator.onLine){
   $("offlineSummary").textContent="離線保存：新聞文字 "+targets.length+" 則；目前沒有網路，照片待連線後下載";
   return;
  }

  let index=0;
  async function photoWorker(){
   while(index<needPhotos.length){
    const a=needPhotos[index++];
    try{
     const result=await saveArticlePhoto(a);
     if(result.ok){success++;if(result.size)bytes+=result.size}
    }catch(e){
     failed++;a.offlineImageError=e.message;
     await putMany([a]).catch(()=>{});
    }
    done++;
    setProgress(already+done,targets.length);
    $("offlineSummary").textContent=
     "離線保存進度："+(already+done)+"/"+targets.length+
     "｜照片成功："+(already+success)+"｜照片失敗："+failed;
    if(done%5===0)scheduleRender();
   }
  }
  await Promise.all([photoWorker(),photoWorker()]);
  const imageCount=targets.filter(a=>
   Array.isArray(a.offlineImages)&&a.offlineImages.some(x=>x&&x.blob&&x.blob.size)
  ).length;
  const mb=(bytes/1024/1024).toFixed(1);
  $("offlineSummary").textContent=
   "離線保存完成：新聞文字 "+targets.length+" 則｜照片已保存 "+imageCount+" 張｜本次下載約 "+mb+" MB";
  log("最新200則離線保存作業完成。\n\n新聞文字：已保存 "+targets.length+" 則\n照片成功：目前共 "+imageCount+" 張\n本次照片下載：約 "+mb+" MB\n照片失敗："+failed+" 張\n\n照片失敗的新聞仍可離線閱讀文字摘要或已取得的全文。");
 }catch(e){
  $("offlineSummary").textContent="離線保存遇到問題："+e.message;
  log("離線保存錯誤："+e.message);
 }finally{
  offlineBusy=false;
  updateStats();
  render();
 }
}

async function manualOfflineSave(){

 if(!navigator.onLine){alert("目前沒有網路。已保存的新聞仍可離線閱讀，照片需要連線才能下載。");return}

function getOfflineImageURL(a){
 if(!Array.isArray(a.offlineImages))return "";
 const item=a.offlineImages.find(x=>x&&x.blob&&x.blob.size);
 if(!item)return "";
 if(offlineObjectURLs.has(a.link))return offlineObjectURLs.get(a.link);
 try{
  const url=URL.createObjectURL(item.blob);
  offlineObjectURLs.set(a.link,url);
  return url;
 }catch(e){return ""}
}

function buildCard(a){
 const isGoogle=(a.source||"").startsWith("Google");
 const isFinance=(a.source||"").includes("財經");
 const card=el("article","card open"+(a.read?" read":"")+(isGoogle?" google":""));
 const meta=el("div","meta");
 const left=el("span","tag",a.source);
 if(isFinance)left.classList.add("finance-label");
 meta.append(left,el("span","",dateText(a.pubDate)));
 const headline=el("div","headline-row");
 const titleBox=el("div","headline-title");
 const h3=el("h3","",a.title);
 const imgs=getDisplayImages(a);
 if(imgs.length){
  const img=el("img","news-thumb");
  let i=0;img.alt=a.title;img.loading="lazy";img.decoding="async";img.referrerPolicy="no-referrer";
  img.onerror=()=>{i++;if(i<imgs.length)img.src=imgs[i];else img.replaceWith(el("div","thumb-placeholder","✦"))};
  img.onclick=()=>showPhoto(img.src);img.src=imgs[0];headline.appendChild(img);
 }else headline.appendChild(el("div","thumb-placeholder","✦"));
 titleBox.appendChild(h3);headline.appendChild(titleBox);
 const body=el("div","body");card.append(meta,headline,body);
 h3.onclick=()=>{card.classList.toggle("open");if(card.classList.contains("open"))card.scrollIntoView({block:"nearest",behavior:"smooth"})};
 if(imgs.length){
  const img=el("img","news-image");let i=0;
  img.alt=a.title;img.loading="lazy";img.decoding="async";img.referrerPolicy="no-referrer";
  img.onerror=()=>{i++;if(i<imgs.length)img.src=imgs[i];else img.remove()};
  img.onclick=()=>showPhoto(img.src);img.src=imgs[0];body.appendChild(img);
 }
 body.appendChild(el("div","desc",stripURL(a.desc)||"目前沒有可顯示的內文。"));
 if((a.fullStatus||"").startsWith("未取得"))body.appendChild(el("div","article-status",a.fullStatus));
 if(a.offlineSaved){
  const hasPhoto=Array.isArray(a.offlineImages)&&a.offlineImages.some(x=>x&&x.blob&&x.blob.size);
  body.appendChild(el("div","article-status offline-status",hasPhoto?"✓ 已保存離線閱讀（文字＋照片）":"✓ 已保存離線閱讀（文字）"));
  if(!hasPhoto&&a.offlineImageError)body.appendChild(el("div","article-status offline-fail","照片尚未成功保存："+a.offlineImageError));
 }
 const actions=el("div","actions");
 const toggle=el("button","",a.read?"標為未讀":"標為已讀");
 toggle.onclick=()=>{a.read=!a.read;card.classList.toggle("read",a.read);toggle.textContent=a.read?"標為未讀":"標為已讀";persist(a);updateStats();if(filter==="unread")render()};
 const star=el("button","star",a.favorite?"★ 已收藏":"☆ 收藏");
 star.onclick=()=>{a.favorite=!a.favorite;star.textContent=a.favorite?"★ 已收藏":"☆ 收藏";persist(a);updateStats();if(filter==="fav")render()};
 actions.append(toggle,star);
 const sourceBtn=el("button","source-btn","↗ 閱讀原文");
 sourceBtn.onclick=()=>{const url=validURL(a.link);if(url){const win=window.open(url,"_blank","noopener");if(!win)location.href=url}};
 actions.appendChild(sourceBtn);
 const offlineBtn=el("button","offline-btn",a.offlineSaved?"✓ 已列入離線":"📥 保存離線");
 offlineBtn.onclick=async()=>{
  if(!navigator.onLine){alert("新聞文字已經可以離線閱讀；若要下載照片，請先連接網路。");return}
  offlineBtn.disabled=true;offlineBtn.textContent="下載中...";
  try{a.offlineSaved=true;await persist(a);await saveArticlePhoto(a);offlineBtn.textContent="✓ 離線完成";render()}
  catch(e){a.offlineSaved=true;await persist(a);offlineBtn.textContent="文字已保存";alert("新聞文字已保存，但照片下載失敗：\n"+e.message);render()}
  finally{offlineBtn.disabled=false}
 };
 actions.appendChild(offlineBtn);
 if(navigator.share){
  const sh=el("button","","分享");
  sh.onclick=()=>navigator.share({title:a.title,url:a.link}).catch(()=>{});
  actions.append(sh);
 }
 body.appendChild(actions);
 return card;
}

function render(){
 updateStats();
 const box=$("news");
 const kw=$("search").value.trim().toLowerCase();
 const list=articles.filter(a=>{
  if(filter==="tw"&&a.category!=="tw")return false;
  if(filter==="cn"&&a.category!=="cn")return false;
  if(filter==="fav"&&!a.favorite)return false;
  if(filter==="unread"&&a.read)return false;
  if(filter==="offline"&&!a.offlineSaved)return false;
  return !kw||(a.title+" "+a.desc+" "+a.source).toLowerCase().includes(kw);
 }).sort(byDate);
 box.replaceChildren();
 if(!list.length){
  const msg=filter==="offline"?"目前沒有離線新聞。連線後按「開始更新新聞」，系統會自動保存最新200則。":"目前沒有符合條件的新聞";
  box.appendChild(el("div","empty",msg));$("more").style.display="none";return;
 }
 const showAll=$("limit").value==="all";
 const count=showAll?list.length:shown;
 const frag=document.createDocumentFragment();
 list.slice(0,count).forEach(a=>frag.appendChild(buildCard(a)));
 box.appendChild(frag);
 const more=!showAll&&list.length>shown;
 $("more").style.display=more?"block":"none";
 if(more)$("moreBtn").textContent="載入更多（還有 "+(list.length-shown)+" 則）";
}

const topFloat=$("topFloat");
window.addEventListener("scroll",()=>topFloat.classList.toggle("hidden",window.scrollY<180),{passive:true});
topFloat.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});

$("sync").onclick=syncNews;
$("test").onclick=testSources;
$("retry").onclick=()=>{if(busy||enriching)return;articles.forEach(a=>{if(!a.full)a.failed=0});enrichArticles(articles,true)};
$("offlineNow").onclick=manualOfflineSave;
$("clearOffline").onclick=clearOfflinePhotos;
$("moreBtn").onclick=()=>{shown+=PAGE;render()};
$("search").oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{shown=PAGE;render()},250)};
$("sort").onchange=()=>{applySettings();shown=PAGE;render()};
$("size").onchange=()=>{applySettings();render()};
$("auto").onchange=applySettings;
$("limit").onchange=()=>{
 applySettings();shown=PAGE;render();
 log($("limit").value==="all"?"已切換全部新聞顯示模式。離線保存仍固定最新200則。":"已變更新聞保存設定。系統仍至少保留最新200則供離線保存。");
};

function setNet(){
 const on=navigator.onLine;
 $("status").textContent=on?"● 網路已連線":"○ 離線閱讀模式";
 $("status").className="status"+(on?"":" offline");
}
window.addEventListener("online",()=>{
 setNet();
 if(db&&!busy&&!offlineBusy)setTimeout(()=>{if(navigator.onLine)autoSaveLatestOffline()},1500);
});
window.addEventListener("offline",setNet);

/* PWA：僅在HTTPS或localhost環境可註冊Service Worker */
async function registerPWA(){
 if(!("serviceWorker" in navigator))return;
 const isSecure=location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1";
 if(!isSecure){
  log("目前是本機檔案預覽模式。新聞資料仍使用本機IndexedDB保存；若要安裝PWA及離線啟動，請部署到HTTPS網站。");
  return;
 }
 try{
  const reg=await navigator.serviceWorker.register("./sw.js");
  await navigator.serviceWorker.ready;
  console.log("NEXUS NEWS Service Worker ready",reg.scope);
 }catch(e){
  console.warn("Service Worker註冊失敗",e);
 }
}

/* 啟動 */
async function start(){
 loadSettings();
 registerPWA();
 try{
  await dbInit();
  articles=await getAll();
  const fix=[];
  articles.forEach(a=>{
   if(!Array.isArray(a.images))a.images=a.image?[a.image]:[];
   if(!Array.isArray(a.offlineImages))a.offlineImages=[];
   if(typeof a.offlineSaved!=="boolean")a.offlineSaved=false;
   if(typeof a.offlineImageSaved!=="boolean")a.offlineImageSaved=a.offlineImages.some(x=>x&&x.blob);
   const t=parseTime(a.pubDate);
   if(t!==a.pubDate){a.pubDate=t;fix.push(a)}
  });
  if(fix.length)putMany(fix).catch(()=>{});
  setNet();render();
  const offlineCount=articles.filter(a=>a.offlineSaved).length;
  const photoCount=articles.filter(a=>Array.isArray(a.offlineImages)&&a.offlineImages.some(x=>x&&x.blob&&x.blob.size)).length;
  $("offlineSummary").textContent="本機載入："+articles.length+" 則新聞｜離線文字："+offlineCount+" 則｜離線照片："+photoCount+" 張";
  if(!articles.length&&navigator.onLine)await syncNews();
  else{
   log("本機新聞載入完成，共 "+articles.length+" 則，依日期由新到舊排列。\n離線文字："+offlineCount+" 則\n離線照片："+photoCount+" 張");
   if(navigator.onLine)setTimeout(()=>{if(!busy&&!offlineBusy)autoSaveLatestOffline()},1800);
  }
 }catch(e){log("資料庫啟動失敗："+e.message)}
}
start();
</script>
